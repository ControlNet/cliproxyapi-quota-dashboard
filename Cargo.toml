[package]
name = "cliproxyapi-quota-dashboard"
version = "0.1.0"
edition = "2021"
description = "Minimal single-page dashboard: log in with a CLIProxyAPI API key and view every OAuth account's quota."

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
futures = "0.3"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
